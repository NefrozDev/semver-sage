name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.0 && npm ci
      - run: npx nx run-many -t lint test build

  # Browser tests of the web app against a mocked API (no database or LLM needed).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.0 && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx nx run web-e2e:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/report
          retention-days: 7

  # Coverage + analysis on the shared SonarQube server (infra/sonarqube). Needs the secrets
  # SONAR_HOST_URL (reachable from GitHub, or use a self-hosted runner) and SONAR_TOKEN; skipped
  # until they're set. Fails when the quality gate fails.
  sonarqube:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_QUALITYGATE_WAIT: 'true'
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_HOST_URL / SONAR_TOKEN secrets are not set; skipping SonarQube."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.skip != 'true'
        with:
          fetch-depth: 0 # blame data for new-code detection
      - uses: actions/setup-node@v4
        if: steps.config.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.0 && npm ci
        if: steps.config.outputs.skip != 'true'
      - run: npm run test:coverage
        if: steps.config.outputs.skip != 'true'
      - run: node tools/sonar-scan.mjs
        if: steps.config.outputs.skip != 'true'
