name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g --ignore-scripts npm@11.6.0 && npm ci --ignore-scripts
      - run: npm run nx -- run-many -t lint test build

  # Ingestion dedupe and version-filtered search against a real Postgres (fake docs, fake embedder).
  integration:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://sage:sage@localhost:5432/semver_sage_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: semver_sage
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sage -d semver_sage"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g --ignore-scripts npm@11.6.0 && npm ci --ignore-scripts
      - run: npm run nx -- run ingestion:integration

  # Browser tests of the web app against a mocked API (no database or LLM needed).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g --ignore-scripts npm@11.6.0 && npm ci --ignore-scripts
      - run: npm run playwright:install
      - run: npm run nx -- run web-e2e:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/report
          retention-days: 7

  # Coverage + analysis on SonarQube Cloud (project keys in sonar-project.properties). Needs the
  # repo secret SONAR_TOKEN (SonarQube Cloud: My Account > Security) and the project's Automatic
  # Analysis turned off (it can't read coverage and blocks CI analysis). Skipped until the secret
  # exists. Fails when the quality gate fails.
  sonarqube:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TEST_DATABASE_URL: postgres://sage:sage@localhost:5432/semver_sage_test
    # For the integration tests' coverage.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: semver_sage
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sage -d semver_sage"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::The SONAR_TOKEN secret is not set; skipping SonarQube."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.skip != 'true'
        with:
          fetch-depth: 0 # blame data for new-code detection
      - uses: actions/setup-node@v4
        if: steps.config.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm install -g --ignore-scripts npm@11.6.0 && npm ci --ignore-scripts
        if: steps.config.outputs.skip != 'true'
      - run: npm run test:coverage
        if: steps.config.outputs.skip != 'true'
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: steps.config.outputs.skip != 'true'
        with:
          args: -Dsonar.qualitygate.wait=true
