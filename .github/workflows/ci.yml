name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.0 && npm ci
      - run: npx nx run-many -t lint test build

  # Browser tests of the web app against a mocked API (no database or LLM needed).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.0 && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx nx run web-e2e:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/report
          retention-days: 7

  # Coverage + analysis on SonarQube. Configure once in the repo settings:
  #   secret   SONAR_TOKEN          token from SonarQube (Cloud: My Account > Security)
  #   variable SONAR_ORGANIZATION   SonarQube Cloud organization key
  #   variable SONAR_PROJECT_KEY    project key shown on the project's page
  #   variable SONAR_HOST_URL       only for a self-hosted server (defaults to SonarQube Cloud)
  # Skipped until SONAR_TOKEN exists. Fails when the quality gate fails. On SonarQube Cloud, turn
  # off Automatic Analysis for the project (it can't read coverage and blocks CI analysis).
  sonarqube:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_QUALITYGATE_WAIT: 'true'
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::The SONAR_TOKEN secret is not set; skipping SonarQube."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.skip != 'true'
        with:
          fetch-depth: 0 # blame data for new-code detection
      - uses: actions/setup-node@v4
        if: steps.config.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.0 && npm ci
        if: steps.config.outputs.skip != 'true'
      - run: npm run test:coverage
        if: steps.config.outputs.skip != 'true'
      - run: node tools/sonar-scan.mjs
        if: steps.config.outputs.skip != 'true'
