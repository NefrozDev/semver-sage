# SonarQube analysis of this repo. Run with `npm run sonar` (coverage + scan); see infra/sonarqube.
sonar.projectKey=semver-sage
sonar.projectName=Semver Sage
sonar.sourceEncoding=UTF-8

sonar.sources=apps,libs,evals/src,tools
sonar.tests=apps,libs,evals/src
sonar.test.inclusions=**/*.spec.ts,apps/web-e2e/**,apps/api-e2e/**
sonar.exclusions=.cache/**,**/node_modules/**,**/dist/**,**/*.spec.ts,apps/web-e2e/**,apps/api-e2e/**,\
  **/vitest.config.mts,**/vitest.e2e.config.mts,**/eslint.config.mjs,**/webpack.config.js,\
  **/rolldown.config.ts,**/playwright.config.ts,**/public/**

# Only this repo's tsconfigs: otherwise the analyzer also walks the docs checkouts in .cache/.
sonar.typescript.tsconfigPaths=apps/*/tsconfig*.json,libs/*/*/tsconfig*.json,evals/tsconfig*.json

# One report for all projects with repo-relative paths, written by tools/sonar-scan.mjs.
sonar.javascript.lcov.reportPaths=coverage/lcov.merged.info
